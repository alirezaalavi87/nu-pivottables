<!DOCTYPE html>
<html>

<head>
    <title>Pivot Demo</title>
    <!-- external libs from cdnjs -->
    <!--Billboard + D3-->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/billboard.js/4.0.3/billboard.pkgd.js"
      integrity="sha512-Akvh+cW38yEAWisQkqRETJuYIewle64e8BK+epxAr7NS12UNkpB2gjJ1XHoMHD4MGew8Rr6Nu+mWoeqT4SQPCQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/billboard.js/4.0.3/billboard.css"
      integrity="sha512-UVUxgwZEfPk5uiolaFs4ORLyLaVfjFoCjBOKh31Rt/gn50RHTUkSsGalUbZ4IZXidzKoIaprV1x9ylrojRBbHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- JQuery -->
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <!-- JQuery-UI -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.14.1/jquery-ui.min.js"
        integrity="sha512-MSOo1aY+3pXCOCdGAYoBZ6YGI0aragoQsg1mKKBHXCYPIWxamwOE7Drh+N5CPgGI5SA9IEKJiPjdfqWFWmZtRA=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <!-- PivotTable.js libs from ../dist -->
    <link rel="stylesheet" type="text/css" href="../dist/pivot.css">
    <script type="text/javascript" src="../dist/pivot.js"></script>
    <script type="text/javascript" src="../dist/bb_renderers.min.js"></script>

    <style>
        body {
            font-family: Verdana;
        }
    </style>

    <!-- for examples only! script to show code to user -->
    <script type="text/javascript" src="show_code.js"></script>
</head>

<body>
    <script type="text/javascript">
        $(function () {
            $.getJSON("mps.json", function (mps) {
                $("#output").pivotUI(mps, {
                    renderers: $.pivotUtilities.bb_renderers,
                    cols: ["Party"], rows: ["Province"],
                });
            });
        });
    </script>

    <p><a href="index.html">&laquo; back to nu-pivottables examples</a></p>

    <div id="output" style="margin: 30px;"></div>
</body>

</html>
