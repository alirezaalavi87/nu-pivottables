<!doctype html>
<html>
    <head>
        <title>Pivot Demo</title>
        <!-- JQuery -->
        <script
            src="https://code.jquery.com/jquery-4.0.0.min.js"
            integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao="
            crossorigin="anonymous"
        ></script>
        <!-- JQuery-UI -->
        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.14.1/jquery-ui.min.js"
            integrity="sha512-MSOo1aY+3pXCOCdGAYoBZ6YGI0aragoQsg1mKKBHXCYPIWxamwOE7Drh+N5CPgGI5SA9IEKJiPjdfqWFWmZtRA=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        ></script>

        <!-- PivotTable.js libs from ../dist -->
        <link rel="stylesheet" type="text/css" href="../dist/pivot.css" />
        <script type="text/javascript" src="../dist/pivot.js"></script>
        <script type="text/javascript" src="../dist/pivot.fr.js"></script>
        <script type="text/javascript" src="../dist/pivot.fa.js"></script>
        <style>
            body {
                font-family: Verdana;
            }
        </style>

        <!-- optional: mobile support with jqueryui-touch-punch -->
        <script
            type="text/javascript"
            src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui-touch-punch/0.2.3/jquery.ui.touch-punch.min.js"
        ></script>

        <!-- for examples only! script to show code to user -->
        <script type="text/javascript" src="show_code.js"></script>
    </head>
    <body>
        <script type="text/javascript">
            // This example shows French localization
            // using the "Canadian Parliament 2012" dataset.

            $(function () {
                $.getJSON("mps.json", function (mps) {
                    $("#output-ltr").pivotUI(mps, { rows: ["Province"], cols: ["Party"] }, false, "fr");
                });
            });
            $(function () {
                $.getJSON("mps.json", function (mps) {
                    $("#output-rtl").pivotUI(mps, { rows: ["Province"], cols: ["Party"] }, false, "fa");
                });
            });
        </script>

        <p><a href="index.html">&laquo; back to nu-pivottables examples</a></p>

        <p>pivot table with French localization:</p>
        <div id="output-ltr" style="margin: 30px"></div>

        <p>And here's with Persian(Farsi) localization which shows support for RTL and BiDi languages:</p>
        <div id="output-rtl" dir="rtl" style="margin: 30px"></div>
    </body>
</html>
